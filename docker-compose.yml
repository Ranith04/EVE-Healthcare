version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: eve_user
      POSTGRES_PASSWORD: eve_password
      POSTGRES_DB: eve_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve_user -d eve_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

volumes:
  postgres-data:
